<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Every Opening</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0a0a0a;
  --gap:     5px;
  --accent:  #e8c84a;
  --fg:      #666;

  /* ── BOARD SIZE ──────────────────────────────────────────
     Change CELL_PX in the <script> block below (search for
     "BOARD SIZE") — that value is mirrored here via JS so
     you only ever need to edit one place.                    */
  --cell-px: 160px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'SF Mono', 'Consolas', monospace;
  overflow: hidden;  /* camera handles all panning — no scrollbars */
}

/* ── LOADING SCREEN ── */
#loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: var(--bg);
  z-index: 200;
  color: #333;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
#load-error {
  color: #c0392b;
  font-size: 11px;
  letter-spacing: 0.06em;
  display: none;
  max-width: 420px;
  text-align: center;
  line-height: 1.8;
  white-space: pre-line;
}

/* ── WALL SCREEN ── */
#wall-screen {
  position: fixed; inset: 0;
  overflow: hidden;
}

/* The camera div is larger than the viewport and gets translated
   by the drift animation. All boards live inside it.            */
#camera {
  position: absolute;
  top: 0; left: 0;
  /* size set in JS once we know grid dimensions */
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* grid of cells */
#grid {
  display: grid;
  grid-template-columns: repeat(25, var(--cell-px));
  gap: var(--gap);
  padding: var(--gap);
  width: max-content;
}

/* cell = canvas + label */
.cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: var(--cell-px);
}
.cell canvas {
  width: var(--cell-px);
  height: var(--cell-px);
  display: block;
  /* pixelated keeps chess pieces sharp when canvas is upscaled */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.cell .gc-label {
  font-size: 9px;
  color: var(--fg);
  letter-spacing: 0.06em;
  line-height: 1;
  white-space: nowrap;
}
.cell.empty canvas  { opacity: 0.06; }
.cell.empty .gc-label { visibility: hidden; }

/* progress bar — always fixed to bottom of viewport */
#prog-track {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  z-index: 100;
}
#prog-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  opacity: 0.45;
}

/* step counter — fixed top-right */
#step-counter {
  position: fixed;
  top: 8px; right: 10px;
  font-size: 9px;
  letter-spacing: 0.14em;
  color: #222;
  z-index: 100;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- ── LOADING SCREEN ── -->
<div id="loading-screen">
  <span>Loading…</span>
  <div id="load-error"></div>
</div>

<!-- ── WALL ── -->
<div id="wall-screen">
  <div id="camera">
    <div id="grid"></div>
  </div>
  <div id="step-counter">MOVE <span id="step-num">0</span> / <span id="step-max">0</span></div>
  <div id="prog-track"><div id="prog-fill"></div></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// ▼▼▼  SET YOUR JSON FILENAME HERE  ▼▼▼
const JSON_FILE = 'lichess_db_standard_rated_2013-08_openings.json';
// ▲▲▲  File must be in the same folder as this HTML file  ▲▲▲
// ═══════════════════════════════════════════════════════════════════════════

// ── CONFIG ──────────────────────────────────────────────────────────────────
const COLS        = 25;
const ROWS        = 20;
const MAX_BOARDS  = COLS * ROWS;  // 500

const STEP_MS     = 1000;   // ms between chess moves

// ─────────────────────────────────────────────────────────────────────────
// ▼▼▼  BOARD SIZE — change this one number to resize all 500 boards  ▼▼▼
const CELL_PX     = 160;    // display size of each board in pixels
// ▲▲▲  Grid will be 25 × CELL_PX wide. At 160px ≈ 4060px total.    ▲▲▲
// ─────────────────────────────────────────────────────────────────────────

// Internal canvas resolution — higher = sharper pieces, slightly more GPU.
// 192 gives crisp pieces at 160px display size (1.2× oversample).
const CANVAS_RES  = 192;
const SQ          = CANVAS_RES / 8;

// Camera drift speed (px per second). Bounces off edges like a DVD logo.
// Increase for faster panning, decrease for slower.
const DRIFT_SPEED = 35;

// ── COLOURS ─────────────────────────────────────────────────────────────────
const C_LIGHT   = '#c9b99a';
const C_DARK    = '#5c3d2a';
const C_HI_FROM = 'rgba(240,220,60,0.45)';
const C_HI_TO   = 'rgba(240,220,60,0.92)';
const C_W       = '#f4efe6';
const C_B       = '#1a1209';
const PIECE_FONT = `bold ${Math.round(SQ * 0.76)}px serif`;

const GLYPHS = {
  wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙',
  bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟',
};

// ═══════════════════════════════════════════════════════════════════════════
// CHESS LOGIC
// ═══════════════════════════════════════════════════════════════════════════
const FILE_IDX = {a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7};

function startPos() {
  return [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR'],
  ];
}

function uciCoords(uci) {
  return {
    fr: 8 - parseInt(uci[1]),
    ff: FILE_IDX[uci[0]],
    tr: 8 - parseInt(uci[3]),
    tf: FILE_IDX[uci[2]],
  };
}

function applyUCI(b, uci) {
  const {fr,ff,tr,tf} = uciCoords(uci);
  let p = b[fr][ff];
  if (!p) return;
  if (uci.length === 5) p = p[0] + uci[4].toUpperCase();
  if (p[1]==='P' && ff!==tf && !b[tr][tf]) b[fr][tf] = null; // en passant
  if (p==='wK' && fr===7 && ff===4) {
    if (tf===6){ b[7][5]='wR'; b[7][7]=null; }
    if (tf===2){ b[7][3]='wR'; b[7][0]=null; }
  }
  if (p==='bK' && fr===0 && ff===4) {
    if (tf===6){ b[0][5]='bR'; b[0][7]=null; }
    if (tf===2){ b[0][3]='bR'; b[0][0]=null; }
  }
  b[tr][tf] = p;
  b[fr][ff] = null;
}

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS RENDERING
// ═══════════════════════════════════════════════════════════════════════════
function drawBoard(ctx, board, fromR, fromF, toR, toF) {
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const x = f*SQ, y = r*SQ;
      ctx.fillStyle = (r+f)%2===0 ? C_LIGHT : C_DARK;
      ctx.fillRect(x, y, SQ, SQ);
      if (fromR !== undefined) {
        if (r===fromR && f===fromF) { ctx.fillStyle=C_HI_FROM; ctx.fillRect(x,y,SQ,SQ); }
        if (r===toR   && f===toF)   { ctx.fillStyle=C_HI_TO;   ctx.fillRect(x,y,SQ,SQ); }
      }
    }
  }
  ctx.font         = PIECE_FONT;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const p = board[r][f];
      if (!p) continue;
      const isW = p[0]==='w';
      ctx.shadowColor = isW ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.08)';
      ctx.shadowBlur  = 2;
      ctx.fillStyle   = isW ? C_W : C_B;
      ctx.fillText(GLYPHS[p]||'?', f*SQ+SQ/2, r*SQ+SQ/2+1);
    }
  }
  ctx.shadowBlur = 0;
}

function drawEmpty(ctx) {
  for (let r=0;r<8;r++) for (let f=0;f<8;f++) {
    ctx.fillStyle = (r+f)%2===0 ? '#181818' : '#141414';
    ctx.fillRect(f*SQ,r*SQ,SQ,SQ);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// GAME COUNT FORMATTER
// ═══════════════════════════════════════════════════════════════════════════
function fmt(n) {
  if (!n && n!==0) return '';
  if (n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if (n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if (n>=1e3) return Math.round(n/1e3)+'K';
  return String(n);
}

// ═══════════════════════════════════════════════════════════════════════════
// WALL STATE
// ═══════════════════════════════════════════════════════════════════════════
let openings = [];
let boards   = [];
let ctxs     = [];
let stepIdx  = 0;
let maxSteps = 0;
let loopTimer = null;

function initBoards(data) {
  openings = [...data].sort((a,b)=>a.rank-b.rank).slice(0, MAX_BOARDS);
  maxSteps = 0;
  for (const o of openings)
    if (o.moves_uci?.length > maxSteps) maxSteps = o.moves_uci.length;

  boards = openings.map(o => ({
    moves: o.moves_uci || [],
    board: startPos(),
  }));
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ctxs = [];

  for (let i = 0; i < MAX_BOARDS; i++) {
    const cell   = document.createElement('div');
    const canvas = document.createElement('canvas');
    const label  = document.createElement('div');

    cell.className   = 'cell' + (i >= openings.length ? ' empty' : '');
    label.className  = 'gc-label';
    canvas.width     = CANVAS_RES;
    canvas.height    = CANVAS_RES;

    const ctx = canvas.getContext('2d', { alpha: false });
    ctxs.push(ctx);

    label.textContent = i < openings.length ? fmt(openings[i].game_count) : '';

    cell.appendChild(canvas);
    cell.appendChild(label);
    grid.appendChild(cell);
  }

  document.getElementById('step-max').textContent = maxSteps;
}

function renderStep(step) {
  for (let i = 0; i < openings.length; i++) {
    const s = boards[i];
    if (step === 0) {
      s.board = startPos();
      drawBoard(ctxs[i], s.board);
      continue;
    }
    const mv = s.moves[step - 1];
    if (mv) {
      const {fr,ff,tr,tf} = uciCoords(mv);
      applyUCI(s.board, mv);
      drawBoard(ctxs[i], s.board, fr, ff, tr, tf);
    }
  }
  for (let i = openings.length; i < MAX_BOARDS; i++) {
    if (step === 0) drawEmpty(ctxs[i]);
  }
  document.getElementById('step-num').textContent = step;
}

function kickProgress() {
  const fill = document.getElementById('prog-fill');
  const pct  = (stepIdx / (maxSteps + 1)) * 100;
  fill.style.transition = 'none';
  fill.style.width = pct + '%';
  fill.getBoundingClientRect();
  fill.style.transition = `width ${STEP_MS}ms linear`;
  fill.style.width = ((stepIdx + 1) / (maxSteps + 1) * 100) + '%';
}

// ═══════════════════════════════════════════════════════════════════════════
// DVD DRIFT CAMERA
// Uses translate3d so the browser composites on the GPU — no pixel snapping,
// no layout recalculation, perfectly smooth 60fps pan.
// Velocity bounces off edges. driftX/driftY are floating-point throughout.
// ═══════════════════════════════════════════════════════════════════════════
let driftX    = 0;
let driftY    = 0;
let velX      = DRIFT_SPEED;
let velY      = DRIFT_SPEED * 0.61803; // golden ratio offset → non-repeating path
let lastRAF   = null;
let prevT     = null;
let maxDriftX = 0;
let maxDriftY = 0;

function startDrift() {
  const grid = document.getElementById('grid');
  const vw   = window.innerWidth;
  const vh   = window.innerHeight;

  // getBoundingClientRect is accurate after the DOM has painted
  const gw = grid.scrollWidth;
  const gh = grid.scrollHeight;

  maxDriftX = Math.max(0, gw - vw);
  maxDriftY = Math.max(0, gh - vh);

  // Start near centre
  driftX = maxDriftX / 2;
  driftY = maxDriftY / 3;

  // Random initial direction
  if (Math.random() > 0.5) velX *= -1;
  if (Math.random() > 0.5) velY *= -1;

  prevT  = performance.now();
  lastRAF = requestAnimationFrame(driftTick);
}

function driftTick(t) {
  // Delta time in seconds, capped so a tab-blur pause doesn't cause a jump
  const dt = Math.min((t - prevT) * 0.001, 0.05);
  prevT = t;

  driftX += velX * dt;
  driftY += velY * dt;

  // Elastic bounce off each edge
  if (driftX <= 0)         { driftX = 0;         velX =  Math.abs(velX); }
  if (driftX >= maxDriftX) { driftX = maxDriftX;  velX = -Math.abs(velX); }
  if (driftY <= 0)         { driftY = 0;          velY =  Math.abs(velY); }
  if (driftY >= maxDriftY) { driftY = maxDriftY;  velY = -Math.abs(velY); }

  // translate3d → GPU layer, no integer rounding, sub-pixel smooth
  document.getElementById('camera').style.transform =
    `translate3d(${-driftX}px, ${-driftY}px, 0)`;

  lastRAF = requestAnimationFrame(driftTick);
}

// ═══════════════════════════════════════════════════════════════════════════
// CHESS ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════
function startLoop() {
  stepIdx = 0;
  renderStep(0);
  kickProgress();

  loopTimer = setInterval(() => {
    stepIdx++;
    if (stepIdx > maxSteps) {
      stepIdx = 0;
      renderStep(0);
    } else {
      renderStep(stepIdx);
    }
    kickProgress();
  }, STEP_MS);
}

// ═══════════════════════════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════════════════════════
function launch(data) {
  document.getElementById('loading-screen').style.display = 'none';
  if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
  if (lastRAF)   { cancelAnimationFrame(lastRAF); lastRAF = null; }

  // Sync CSS variable with JS constant — one source of truth
  document.documentElement.style.setProperty('--cell-px', CELL_PX + 'px');

  initBoards(data);
  buildGrid();

  // Let the DOM paint one frame so grid dimensions are available
  requestAnimationFrame(() => {
    startDrift();
    startLoop();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT — load JSON then launch
// ═══════════════════════════════════════════════════════════════════════════
function showLoadError(msg) {
  const screen = document.getElementById('loading-screen');
  const err    = document.getElementById('load-error');
  screen.querySelector('span').style.display = 'none';
  err.textContent   = msg;
  err.style.display = 'block';
}

function parseAndLaunch(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch(e) { showLoadError('Invalid JSON: ' + e.message); return; }

  const data = Array.isArray(parsed) ? parsed : parsed?.openings;
  if (!Array.isArray(data) || data.length === 0) {
    showLoadError('"openings" array not found or empty in ' + JSON_FILE);
    return;
  }
  if (!Array.isArray(data[0]?.moves_uci)) {
    showLoadError('Each entry needs a moves_uci array. Check JSON format.');
    return;
  }
  launch(data);
}

fetch(JSON_FILE)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} — could not load: ${JSON_FILE}`);
    return r.text();
  })
  .then(parseAndLaunch)
  .catch(e => {
    if (location.protocol === 'file:') {
      showLoadError(
        `Cannot load "${JSON_FILE}" via file:// protocol.\n\n` +
        `Run a local server instead:\n` +
        `  python3 -m http.server 8000\n\n` +
        `Then open:  http://localhost:8000\n\n` +
        `(Falling back to demo data in 3 seconds…)`
      );
      setTimeout(() => launch(DEMO_OPENINGS), 3000);
    } else {
      showLoadError(e.message);
    }
  });
</script>
</body>
