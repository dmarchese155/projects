<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Every Opening</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0a0a0a;
  --gap:     5px;
  --accent:  #e8c84a;
  --fg:      #666;

  /* ── BOARD SIZE ──────────────────────────────────────────
     Change CELL_PX in the <script> block below (search for
     "BOARD SIZE") — that value is mirrored here via JS so
     you only ever need to edit one place.                    */
  --cell-px: 160px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'SF Mono', 'Consolas', monospace;
  overflow: hidden;  /* camera handles all panning — no scrollbars */
}

/* ── LOADING SCREEN ── */
#loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: var(--bg);
  z-index: 200;
  color: #333;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
#load-error {
  color: #c0392b;
  font-size: 11px;
  letter-spacing: 0.06em;
  display: none;
  max-width: 420px;
  text-align: center;
  line-height: 1.8;
  white-space: pre-line;
}

/* ── WALL SCREEN ── */
#wall-screen {
  position: fixed; inset: 0;
  overflow: hidden;
}

/* The camera div is larger than the viewport and gets translated
   by the drift animation. All boards live inside it.            */
#camera {
  position: absolute;
  top: 0; left: 0;
  /* size set in JS once we know grid dimensions */
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* grid of cells */
#grid {
  display: grid;
  grid-template-columns: repeat(25, var(--cell-px));
  gap: var(--gap);
  padding: var(--gap);
  width: max-content;
}

/* cell = canvas + label */
.cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: var(--cell-px);
}
.cell canvas {
  width: var(--cell-px);
  height: var(--cell-px);
  display: block;
  /* bilinear scaling — eliminates pixel-boundary jitter during pan */
  image-rendering: auto;
}
.cell .gc-label {
  font-size: clamp(7px, 0.55vw, 10px);
  color: var(--fg);
  letter-spacing: 0.04em;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: var(--cell-px);
  text-align: center;
}
.cell .gc-label .lbl-rank  { color: #444; }
.cell .gc-label .lbl-count { color: #666; }
.cell .gc-label .lbl-name  { color: #4a4a4a; font-style: italic; }
.cell.empty canvas  { opacity: 0.06; }
.cell.empty .gc-label { visibility: hidden; }

/* progress bar — always fixed to bottom of viewport */
#prog-track {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  z-index: 100;
}
#prog-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  opacity: 0.45;
}

/* step counter — fixed top-right */
#step-counter {
  position: fixed;
  top: 8px; right: 10px;
  font-size: 9px;
  letter-spacing: 0.14em;
  color: #222;
  z-index: 100;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- ── LOADING SCREEN ── -->
<div id="loading-screen">
  <span>Loading…</span>
  <div id="load-error"></div>
</div>

<!-- ── WALL ── -->
<div id="wall-screen">
  <div id="camera">
    <div id="grid"></div>
  </div>
  <div id="step-counter">MOVE <span id="step-num">0</span> / <span id="step-max">0</span></div>
  <div id="prog-track"><div id="prog-fill"></div></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// ▼▼▼  SET YOUR JSON FILENAME HERE  ▼▼▼
const JSON_FILE = 'lichess_db_standard_rated_2026-04_openings.json';
// ▲▲▲  File must be in the same folder as this HTML file  ▲▲▲
// ═══════════════════════════════════════════════════════════════════════════

// ── CONFIG ──────────────────────────────────────────────────────────────────
const COLS        = 25;
const ROWS        = 20;
const MAX_BOARDS  = COLS * ROWS;  // 500

const STEP_MS     = 1000;   // ms between chess moves

// ─────────────────────────────────────────────────────────────────────────
// ▼▼▼  BOARD SIZE — change this one number to resize all 500 boards  ▼▼▼
const CELL_PX     = 160;    // display size of each board in pixels
// ▲▲▲  Grid will be 25 × CELL_PX wide. At 160px ≈ 4060px total.    ▲▲▲
// ─────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────
// ▼▼▼  DRIFT SPEED — camera pan speed in pixels per second  ▼▼▼
const DRIFT_SPEED = 30;     // lower = slower drift, higher = faster
// ─────────────────────────────────────────────────────────────────────────

// Internal canvas resolution. 2× oversample relative to CELL_PX keeps
// pieces sharp under bilinear scaling during the pan.
const CANVAS_RES  = CELL_PX * 2;
const SQ          = CANVAS_RES / 8;

// ── COLOURS ─────────────────────────────────────────────────────────────────
const C_LIGHT   = '#c9b99a';
const C_DARK    = '#5c3d2a';
const C_HI_FROM = 'rgba(240,220,60,0.45)';
const C_HI_TO   = 'rgba(240,220,60,0.92)';
const C_W       = '#f4efe6';
const C_B       = '#1a1209';
const PIECE_FONT = `bold ${Math.round(SQ * 0.76)}px serif`;

const GLYPHS = {
  wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙',
  bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟',
};

// ═══════════════════════════════════════════════════════════════════════════
// CHESS LOGIC
// ═══════════════════════════════════════════════════════════════════════════
const FILE_IDX = {a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7};

function startPos() {
  return [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR'],
  ];
}

function uciCoords(uci) {
  return {
    fr: 8 - parseInt(uci[1]),
    ff: FILE_IDX[uci[0]],
    tr: 8 - parseInt(uci[3]),
    tf: FILE_IDX[uci[2]],
  };
}

function applyUCI(b, uci) {
  const {fr,ff,tr,tf} = uciCoords(uci);
  let p = b[fr][ff];
  if (!p) return;
  if (uci.length === 5) p = p[0] + uci[4].toUpperCase();
  if (p[1]==='P' && ff!==tf && !b[tr][tf]) b[fr][tf] = null; // en passant
  if (p==='wK' && fr===7 && ff===4) {
    if (tf===6){ b[7][5]='wR'; b[7][7]=null; }
    if (tf===2){ b[7][3]='wR'; b[7][0]=null; }
  }
  if (p==='bK' && fr===0 && ff===4) {
    if (tf===6){ b[0][5]='bR'; b[0][7]=null; }
    if (tf===2){ b[0][3]='bR'; b[0][0]=null; }
  }
  b[tr][tf] = p;
  b[fr][ff] = null;
}

// ═══════════════════════════════════════════════════════════════════════════
// OPTIMISATION 1 — PRE-RENDERED PIECE SPRITES
// Draw each of the 12 piece glyphs once at startup onto small offscreen
// canvases. Every board draw then uses drawImage() instead of fillText(),
// eliminating font layout, glyph rasterisation, and shadow blur per frame.
// drawImage is 5-10× faster than fillText for repeated use.
// ═══════════════════════════════════════════════════════════════════════════
const SPRITE = {};   // key: 'wK', 'bP', etc. → ImageBitmap (set in buildSprites)

async function buildSprites() {
  const size = SQ;
  const keys = Object.keys(GLYPHS);

  for (const key of keys) {
    const oc  = document.createElement('canvas');
    oc.width  = size;
    oc.height = size;
    const cx  = oc.getContext('2d');
    const isW = key[0] === 'w';

    cx.font         = PIECE_FONT;
    cx.textAlign    = 'center';
    cx.textBaseline = 'middle';

    // Outline pass (no blur — just a 1px offset for contrast)
    cx.fillStyle = isW ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.12)';
    cx.fillText(GLYPHS[key], size/2 + 1, size/2 + 2);

    // Main fill
    cx.fillStyle = isW ? C_W : C_B;
    cx.fillText(GLYPHS[key], size/2, size/2 + 1);

    // Convert to ImageBitmap — GPU-resident, fastest possible drawImage source
    SPRITE[key] = await createImageBitmap(oc);
  }
}

// ── Pre-baked empty board ImageBitmap (drawn once, reused for all resets) ──
let EMPTY_BOARD_SPRITE = null;
let START_BOARD_SPRITE = null;

async function buildBoardSprites() {
  // Empty board (for unfilled cells)
  const ec  = document.createElement('canvas');
  ec.width  = CANVAS_RES; ec.height = CANVAS_RES;
  const ecx = ec.getContext('2d');
  for (let r=0;r<8;r++) for (let f=0;f<8;f++) {
    ecx.fillStyle = (r+f)%2===0 ? '#181818' : '#141414';
    ecx.fillRect(f*SQ,r*SQ,SQ,SQ);
  }
  EMPTY_BOARD_SPRITE = await createImageBitmap(ec);

  // Starting position board (drawn once, stamped on every reset)
  const sc  = document.createElement('canvas');
  sc.width  = CANVAS_RES; sc.height = CANVAS_RES;
  const scx = sc.getContext('2d');
  drawBoardToCtx(scx, startPos(), -1, -1, -1, -1);
  START_BOARD_SPRITE = await createImageBitmap(sc);
}

// ── Core draw function — uses sprites, no shadow, batches by colour ──
function drawBoardToCtx(ctx, board, fromR, fromF, toR, toF) {
  // Pass 1: squares (batch light then dark to minimise fillStyle changes)
  ctx.fillStyle = C_LIGHT;
  for (let r=0;r<8;r++) for (let f=0;f<8;f++)
    if ((r+f)%2===0) ctx.fillRect(f*SQ,r*SQ,SQ,SQ);
  ctx.fillStyle = C_DARK;
  for (let r=0;r<8;r++) for (let f=0;f<8;f++)
    if ((r+f)%2!==0) ctx.fillRect(f*SQ,r*SQ,SQ,SQ);

  // Pass 2: highlights
  if (fromR >= 0) {
    ctx.fillStyle = C_HI_FROM;
    ctx.fillRect(fromF*SQ, fromR*SQ, SQ, SQ);
    ctx.fillStyle = C_HI_TO;
    ctx.fillRect(toF*SQ,   toR*SQ,   SQ, SQ);
  }

  // Pass 3: pieces via pre-rendered sprites (drawImage — no font, no shadow)
  for (let r=0;r<8;r++) for (let f=0;f<8;f++) {
    const p = board[r][f];
    if (p && SPRITE[p]) ctx.drawImage(SPRITE[p], f*SQ, r*SQ);
  }
}

// Convenience wrappers
function drawBoard(ctx, board, fromR, fromF, toR, toF) {
  drawBoardToCtx(ctx, board,
    fromR === undefined ? -1 : fromR,
    fromF === undefined ? -1 : fromF,
    toR   === undefined ? -1 : toR,
    toF   === undefined ? -1 : toF);
}

function drawEmpty(ctx) {
  if (EMPTY_BOARD_SPRITE) ctx.drawImage(EMPTY_BOARD_SPRITE, 0, 0);
  else {
    ctx.fillStyle = '#141414';
    ctx.fillRect(0, 0, CANVAS_RES, CANVAS_RES);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// GAME COUNT FORMATTER
// ═══════════════════════════════════════════════════════════════════════════
function fmt(n) {
  if (!n && n!==0) return '';
  if (n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if (n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if (n>=1e3) return Math.round(n/1e3)+'K';
  return String(n);
}

// ═══════════════════════════════════════════════════════════════════════════
// WALL STATE
// ═══════════════════════════════════════════════════════════════════════════
let openings = [];
let boards   = [];
let ctxs     = [];
let stepIdx  = 0;
let maxSteps = 0;

// OPTIMISATION 3 — SPREAD REDRAWS ACROSS FRAMES
// After a chess step fires, we push dirty board indices onto this queue.
// mainTick drains DRAIN_PER_FRAME boards per frame so no single frame
// does more than ~5ms of canvas work. Camera keeps moving while draining.
const DRAIN_PER_FRAME = 80;  // boards redrawn per frame (tune up/down)
let drawQueue = [];           // [{idx, fromR, fromF, toR, toF}]

function initBoards(data) {
  openings = [...data].sort((a,b)=>a.rank-b.rank).slice(0, MAX_BOARDS);
  maxSteps = 0;
  for (const o of openings)
    if (o.moves_uci?.length > maxSteps) maxSteps = o.moves_uci.length;

  boards = openings.map(o => ({
    moves: o.moves_uci || [],
    board: startPos(),
    dirty: false,   // OPTIMISATION 2 — only redraw boards that changed
  }));
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ctxs = [];

  for (let i = 0; i < MAX_BOARDS; i++) {
    const cell   = document.createElement('div');
    const canvas = document.createElement('canvas');
    const label  = document.createElement('div');

    cell.className   = 'cell' + (i >= openings.length ? ' empty' : '');
    label.className  = 'gc-label';
    canvas.width     = CANVAS_RES;
    canvas.height    = CANVAS_RES;

    const ctx = canvas.getContext('2d', { alpha: false });
    ctxs.push(ctx);

    if (i < openings.length) {
      const o    = openings[i];
      const rank = document.createElement('span');
      const cnt  = document.createElement('span');
      const name = document.createElement('span');

      rank.className = 'lbl-rank';
      cnt.className  = 'lbl-count';
      name.className = 'lbl-name';

      rank.textContent = '#' + o.rank;
      cnt.textContent  = fmt(o.game_count);
      name.textContent = o.opening_name || '—';

      label.appendChild(rank);
      label.appendChild(document.createTextNode(' · '));
      label.appendChild(cnt);
      label.appendChild(document.createElement('br'));
      label.appendChild(name);
    }

    cell.appendChild(canvas);
    cell.appendChild(label);
    grid.appendChild(cell);
  }

  document.getElementById('step-max').textContent = maxSteps;
}

// queueStep: called when a chess step fires.
// Computes which boards need redrawing and adds them to the draw queue.
// Does NOT draw anything — drawing happens in drainQueue() inside mainTick.
function queueStep(step) {
  drawQueue = []; // clear any leftover from previous step

  if (step === 0) {
    // Reset — all boards need redrawing
    for (let i = 0; i < openings.length; i++) {
      boards[i].board = startPos();
      drawQueue.push({ idx: i, fromR: -1, fromF: -1, toR: -1, toF: -1 });
    }
    // Empty cells also need the empty sprite stamped (only once at init really)
    for (let i = openings.length; i < MAX_BOARDS; i++) {
      drawQueue.push({ idx: i, empty: true });
    }
  } else {
    // OPTIMISATION 2: only queue boards that have a move at this step
    for (let i = 0; i < openings.length; i++) {
      const mv = boards[i].moves[step - 1];
      if (mv) {
        const {fr,ff,tr,tf} = uciCoords(mv);
        applyUCI(boards[i].board, mv);
        drawQueue.push({ idx: i, fromR: fr, fromF: ff, toR: tr, toF: tf });
      }
      // boards without a move at this step: no entry → no redraw → free
    }
  }

  document.getElementById('step-num').textContent = step;
}

// drainQueue: called every rAF frame, draws up to DRAIN_PER_FRAME boards
function drainQueue() {
  const end = Math.min(DRAIN_PER_FRAME, drawQueue.length);
  for (let i = 0; i < end; i++) {
    const job = drawQueue[i];
    if (job.empty) {
      drawEmpty(ctxs[job.idx]);
    } else {
      drawBoard(ctxs[job.idx], boards[job.idx].board,
        job.fromR, job.fromF, job.toR, job.toF);
    }
  }
  drawQueue.splice(0, end);
}

function kickProgress() {
  const fill = document.getElementById('prog-fill');
  const pct  = (stepIdx / (maxSteps + 1)) * 100;
  fill.style.transition = 'none';
  fill.style.width = pct + '%';
  fill.getBoundingClientRect();
  fill.style.transition = `width ${STEP_MS}ms linear`;
  fill.style.width = ((stepIdx + 1) / (maxSteps + 1) * 100) + '%';
}

// ═══════════════════════════════════════════════════════════════════════════
// UNIFIED ANIMATION LOOP
// One single requestAnimationFrame loop drives BOTH the camera drift AND
// the chess step timer. This guarantees the camera never gets starved —
// there is no separate setInterval competing for the thread.
// ═══════════════════════════════════════════════════════════════════════════

// ── Camera state ──
let camX      = 0;
let camY      = 0;
let tgtX      = 0;
let tgtY      = 0;
let velX      = DRIFT_SPEED;
let velY      = DRIFT_SPEED * 0.61803;
let maxDriftX = 0;
let maxDriftY = 0;
let camEl     = null;
const LERP    = 0.1;  // smoothing per-frame at 60fps — higher = snappier

// ── Chess step state ──
let stepAccum = 0;    // accumulated ms since last chess step

// ── Loop handle ──
let rafHandle = null;
let prevT     = null;

function startMainLoop() {
  camEl = document.getElementById('camera');

  const grid = document.getElementById('grid');
  maxDriftX = Math.max(0, grid.scrollWidth  - window.innerWidth);
  maxDriftY = Math.max(0, grid.scrollHeight - window.innerHeight);

  camX = tgtX = maxDriftX / 2;
  camY = tgtY = maxDriftY / 3;
  if (Math.random() > 0.5) velX *= -1;
  if (Math.random() > 0.5) velY *= -1;

  stepIdx   = 0;
  stepAccum = 0;
  drawQueue = [];

  queueStep(0);
  kickProgress();

  prevT     = performance.now();
  rafHandle = requestAnimationFrame(mainTick);
}

function mainTick(t) {
  // Always reschedule FIRST — nothing can kill the loop
  rafHandle = requestAnimationFrame(mainTick);

  const dt  = Math.min((t - prevT) * 0.001, 0.1); // seconds, capped
  prevT = t;

  // ── 1. Camera drift (runs every frame — truly continuous) ──
  tgtX += velX * dt;
  tgtY += velY * dt;

  if (tgtX <= 0)         { tgtX = 0;         velX =  Math.abs(velX); }
  if (tgtX >= maxDriftX) { tgtX = maxDriftX;  velX = -Math.abs(velX); }
  if (tgtY <= 0)         { tgtY = 0;          velY =  Math.abs(velY); }
  if (tgtY >= maxDriftY) { tgtY = maxDriftY;  velY = -Math.abs(velY); }

  // Frame-rate-independent lerp
  const alpha = 1 - Math.pow(1 - LERP, dt * 60);
  camX += (tgtX - camX) * alpha;
  camY += (tgtY - camY) * alpha;

  camEl.style.transform = `translate3d(${-camX}px,${-camY}px,0)`;

  // ── 2. Drain the board draw queue (DRAIN_PER_FRAME boards per frame) ──
  // This spreads canvas work across frames so no single frame spikes >16ms
  if (drawQueue.length > 0) drainQueue();

  // ── 3. Chess step timer (accumulator — fires every STEP_MS ms) ──
  stepAccum += dt * 1000;
  if (stepAccum >= STEP_MS) {
    stepAccum -= STEP_MS;
    stepIdx++;
    if (stepIdx > maxSteps) {
      stepIdx = 0;
    }
    queueStep(stepIdx);
    kickProgress();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════════════════════════
function launch(data) {
  document.getElementById('loading-screen').style.display = 'none';
  if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }

  document.documentElement.style.setProperty('--cell-px', CELL_PX + 'px');

  initBoards(data);
  buildGrid();

  // Build GPU-resident piece sprites first, then start the loop
  Promise.all([buildSprites(), buildBoardSprites()]).then(() => {
    requestAnimationFrame(() => requestAnimationFrame(startMainLoop));
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BUILT-IN DEMO DATA (50 openings — used when JSON_FILE can't be fetched)
// ═══════════════════════════════════════════════════════════════════════════
const DEMO_OPENINGS = [
  {rank:1,  moves_uci:["e2e4"],                                                                   game_count:2860395163, opening_name:"King's Pawn Opening"},
  {rank:2,  moves_uci:["d2d4"],                                                                   game_count:1221713123, opening_name:"Queen's Pawn Opening"},
  {rank:3,  moves_uci:["e2e4","e7e5"],                                                            game_count:1169514886, opening_name:"Open Game"},
  {rank:4,  moves_uci:["e2e4","e7e5","g1f3"],                                                     game_count:712523011,  opening_name:"King's Knight Opening"},
  {rank:5,  moves_uci:["e2e4","c7c5"],                                                            game_count:521312864,  opening_name:"Sicilian Defense"},
  {rank:6,  moves_uci:["d2d4","d7d5"],                                                            game_count:506764315,  opening_name:"Queen's Pawn Game"},
  {rank:7,  moves_uci:["e2e4","e7e5","g1f3","b8c6"],                                             game_count:439064694,  opening_name:"Open Game"},
  {rank:8,  moves_uci:["e2e4","d7d5"],                                                            game_count:296742446,  opening_name:"Scandinavian Defense"},
  {rank:9,  moves_uci:["e2e4","e7e6"],                                                            game_count:290625721,  opening_name:"French Defense"},
  {rank:10, moves_uci:["e2e4","c7c5","g1f3"],                                                     game_count:277868022,  opening_name:"Sicilian: Open"},
  {rank:11, moves_uci:["d2d4","g8f6"],                                                            game_count:237290777,  opening_name:"Indian Defense"},
  {rank:12, moves_uci:["d2d4","d7d5","c2c4"],                                                     game_count:198411098,  opening_name:"Queen's Gambit"},

// BOOT — load JSON then launch
// ═══════════════════════════════════════════════════════════════════════════
function showLoadError(msg) {
  const screen = document.getElementById('loading-screen');
  const err    = document.getElementById('load-error');
  screen.querySelector('span').style.display = 'none';
  err.textContent   = msg;
  err.style.display = 'block';
}

function parseAndLaunch(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch(e) { showLoadError('Invalid JSON: ' + e.message); return; }

  const data = Array.isArray(parsed) ? parsed : parsed?.openings;
  if (!Array.isArray(data) || data.length === 0) {
    showLoadError('"openings" array not found or empty in ' + JSON_FILE);
    return;
  }
  if (!Array.isArray(data[0]?.moves_uci)) {
    showLoadError('Each entry needs a moves_uci array. Check JSON format.');
    return;
  }
  launch(data);
}

fetch(JSON_FILE)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} — could not load: ${JSON_FILE}`);
    return r.text();
  })
  .then(parseAndLaunch)
  .catch(e => {
    if (location.protocol === 'file:') {
      showLoadError(
        `Cannot load "${JSON_FILE}" via file:// protocol.\n\n` +
        `Run a local server instead:\n` +
        `  python3 -m http.server 8000\n\n` +
        `Then open:  http://localhost:8000\n\n` +
        `(Falling back to demo data in 3 seconds…)`
      );
      setTimeout(() => launch(DEMO_OPENINGS), 3000);
    } else {
      showLoadError(e.message);
    }
  });
</script>
